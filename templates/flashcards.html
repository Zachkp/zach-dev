<!-- templates/flashcards.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Zach-Dev</title>
    <link rel="icon" href="images/favicon.ico" type="image/png" sizes="64x64">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="relative h-full w-full bg-gray-950 text-gray-200 font-sans min-h-screen animated-grid">
    <div class="fixed top-0 z-[-2] h-screen w-screen bg-[#000000] bg-[radial-gradient(#ffffff33_1px,#00091d_1px)] bg-[size:20px_20px] animate-diagonal-drift"></div>

    <!-- Desktop & Mobile Navigation -->
    <header class="fixed top-0 left-0 right-0 z-40 shadow-lg bg-gray-950/80 backdrop-blur-md border-b border-gray-800/50">
        <!-- Mobile Accordion Menu -->
        <div class="sm:hidden" x-data="{ open: false }">
            <div class="flex justify-between items-center p-4">
                <span class="text-lg font-semibold lavender-text">Zach-Dev</span>
                <button @click="open = !open"
                        class="lavender-text hover:text-purple-300 transition-colors p-2">
                    <svg x-show="!open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg x-show="open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div x-show="open"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 transform -translate-y-2"
                 x-transition:enter-end="opacity-100 transform translate-y-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 transform translate-y-0"
                 x-transition:leave-end="opacity-0 transform -translate-y-2"
                 class="bg-gray-900/95 backdrop-blur-sm border-t border-gray-800/50">
                <nav class="flex flex-col">
                    <a href="/"
                       class="lavender-text hover:text-purple-300 hover:bg-gray-800/50 transition-all duration-200 px-6 py-4 border-b border-gray-800/30">
                        Home
                    </a>
                    <a href="/#Project"
                       class="lavender-text hover:text-purple-300 hover:bg-gray-800/50 transition-all duration-200 px-6 py-4 border-b border-gray-800/30">
                        Projects
                    </a>
                    <a href="#"
                       @click="open = false"
                       hx-get="/contact-form"
                       hx-target="#contact-overlay"
                       hx-swap="innerHTML"
                       class="lavender-text hover:text-purple-300 hover:bg-gray-800/50 transition-all duration-200 px-6 py-4 border-b border-gray-800/30">
                        Contact
                    </a>
                    <a href="#"
                    @click="open = false"
                    hx-get="/url-shortener"
                    hx-target="#url-shortener-overlay"
                    hx-swap="innerHTML"
                    class="lavender-text hover:text-purple-300 hover:bg-gray-800/50 transition-all duration-200 px-6 py-4 border-b border-gray-800/30">URL-Short</a>
                    <a href="/flashcards"
                    @click="open = false"
                    class="text-purple-300 hover:text-purple-200 hover:bg-gray-800/50 transition-all duration-200 px-6 py-4">Flashcards</a>
                </nav>
            </div>
        </div>

        <!-- Desktop Navigation (hidden on mobile) -->
        <div class="hidden sm:flex justify-center p-4 md:p-6">
            <nav class="flex space-x-10">
                <a href="/" class="lavender-text hover:text-purple-300 transition-colors">Home</a>
                <a href="/#Project" class="lavender-text hover:text-purple-300 transition-colors">Projects</a>
                <a href="#"
                   hx-get="/contact-form"
                   hx-target="#contact-overlay"
                   hx-swap="innerHTML"
                   class="lavender-text hover:text-purple-300 transition-colors">Contact</a>
                <a href="#"
                    hx-get="/url-shortener"
                    hx-target="#url-shortener-overlay"
                    hx-swap="innerHTML"
                    class="lavender-text hover:text-purple-300 transition-colors">URL-Short</a>
                <a href="/flashcards" class="text-purple-300 hover:text-purple-200 transition-colors">Flashcards</a>
            </nav>
        </div>
    </header>
    <hr class="mx-4 md:mx-10">

    <main class="max-w-4xl mx-auto min-h-screen flex items-center justify-center pt-20 pb-12 px-4 md:px-6">
        <div class="card-padded flex flex-col w-full" style="min-height: 70vh;">
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold mb-4 lavender-text">Flashcards</h1>
                <p class="text-gray-300 mb-2">
                    Upload a CSV with two columns — term and definition — and study it as flip cards.
                </p>
                <p class="text-xs text-gray-500">A header row like "term,definition" is optional.</p>
            </div>

            <div id="flashcards-content"
                 class="flex flex-col flex-1 min-h-0"
                 hx-get="/flashcards-form"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="flex-1 flex items-center justify-center text-gray-500 text-sm">
                    Loading...
                </div>
            </div>
        </div>
    </main>

    <!-- Contact Form Overlay -->
    <div id="contact-overlay" class="fixed inset-0 z-50 hidden"></div>
    <div id="url-shortener-overlay" class="fixed inset-0 z-50 hidden"></div>

    <script>
        // Alpine component powering the flip-card viewer
        function flashcardApp(cards) {
            return {
                cards: cards,
                index: 0,
                flipped: false,
                next() {
                    this.flipped = false;
                    this.index = (this.index + 1) % this.cards.length;
                },
                prev() {
                    this.flipped = false;
                    this.index = (this.index - 1 + this.cards.length) % this.cards.length;
                },
                shuffle() {
                    for (let i = this.cards.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
                    }
                    this.index = 0;
                    this.flipped = false;
                }
            }
        }
    </script>
</body>
</html>
